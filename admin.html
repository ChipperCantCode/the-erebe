<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — The Erebe</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Admin</h1>
      <p>The Erebe — YOUtopia 2026</p>
    </div>
    <nav class="top-links">
      <a href="participate.html">← Wish List</a>
    </nav>
  </header>

  <div id="notice-area"></div>

  <div id="login-box" class="card hidden">
    <h2 class="section-title" style="margin-top:0;">Admin login</h2>
    <div class="row">
      <div class="field-group">
        <label class="field">Name</label>
        <input id="admin-name" type="text" />
      </div>
      <div class="field-group">
        <label class="field">Passcode</label>
        <input id="admin-passcode" type="password" />
      </div>
    </div>
    <button type="button" id="admin-login-btn">Log in</button>
  </div>

  <div id="dashboard" class="hidden">
    <button type="button" id="admin-logout" class="secondary small" style="float:right;">Log out</button>
    <div class="tabs">
      <button type="button" class="active" data-tab="change-requests">Change Requests</button>
      <button type="button" data-tab="donors">Donors</button>
      <button type="button" data-tab="wishlist">Wish List Items</button>
      <button type="button" data-tab="homepage">Homepage Copy</button>
    </div>

    <div id="tab-change-requests" class="tab-panel"></div>
    <div id="tab-donors" class="tab-panel hidden"></div>
    <div id="tab-wishlist" class="tab-panel hidden"></div>
    <div id="tab-homepage" class="tab-panel hidden"></div>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
